<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TodoApp.pk — Simple Todo List</title>
<meta name="description" content="Free todo list app by Shahab Khan. Add, edit, complete & filter tasks. Saved in your browser.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:linear-gradient(135deg,#0D1117,#161B22 60%,#0D1117); color:#E6EDF3; padding:20px; }
  h1 { font-size:1.6rem; margin-bottom:4px; }
  h1 span { color:#A371F7; }
  .tagline { color:#8B949E; font-size:.9rem; margin-bottom:18px; }
  .app { background:#161B22; border:1px solid #30363D; border-radius:18px; padding:22px;
         width:min(460px,94vw); box-shadow:0 12px 40px rgba(0,0,0,.5); }
  .add { display:flex; gap:8px; margin-bottom:14px; }
  .add input { flex:1; background:#0D1117; border:1px solid #30363D; border-radius:10px;
               padding:12px 14px; color:#E6EDF3; font-size:1rem; outline:none; }
  .add input:focus { border-color:#A371F7; }
  .add button { background:#8957E5; color:#fff; border:none; border-radius:10px;
                padding:12px 18px; font-size:1rem; font-weight:700; cursor:pointer; }
  .add button:hover { background:#A371F7; }
  .filters { display:flex; gap:6px; margin-bottom:14px; }
  .filters button { flex:1; background:#21262D; color:#E6EDF3; border:1px solid #30363D;
                    border-radius:10px; padding:8px 0; font-size:.85rem; cursor:pointer; }
  .filters button.active { background:#8957E5; border-color:#8957E5; font-weight:700; }
  ul { list-style:none; }
  li { display:flex; align-items:center; gap:10px; background:#0D1117; border:1px solid #30363D;
       border-radius:10px; padding:12px; margin-bottom:8px; animation:slideIn .2s ease; }
  @keyframes slideIn { from{opacity:0; transform:translateY(-4px);} to{opacity:1;} }
  li input[type=checkbox] { width:18px; height:18px; accent-color:#8957E5; cursor:pointer; flex-shrink:0; }
  li .text { flex:1; word-break:break-word; }
  li.done .text { text-decoration:line-through; color:#8B949E; }
  li .edit, li .del { background:none; border:none; cursor:pointer; font-size:1rem; padding:4px; }
  li .del:hover { filter:brightness(1.4); }
  li input.edit-input { flex:1; background:#161B22; border:1px solid #8957E5; border-radius:6px;
                        padding:6px 8px; color:#E6EDF3; font-size:1rem; outline:none; }
  .empty { text-align:center; color:#8B949E; padding:24px 0; }
  .footer-bar { display:flex; justify-content:space-between; align-items:center; margin-top:14px; font-size:.85rem; color:#8B949E; }
  .footer-bar button { background:none; border:none; color:#F85149; cursor:pointer; font-size:.85rem; }
  .footer-bar button:hover { text-decoration:underline; }
  footer { margin-top:18px; color:#8B949E; font-size:.85rem; text-align:center; }
  footer a { color:#00BFFF; text-decoration:none; }
</style>
</head>
<body>
  <h1>✅ Todo<span>App</span>.pk</h1>
  <p class="tagline">Organize your day — saved automatically in your browser</p>

  <div class="app">
    <div class="add">
      <input type="text" id="newTask" placeholder="What do you need to do?">
      <button id="addBtn">Add</button>
    </div>
    <div class="filters">
      <button data-f="all" class="active">All</button>
      <button data-f="active">Active</button>
      <button data-f="done">Completed</button>
    </div>
    <ul id="list"></ul>
    <div class="footer-bar">
      <span id="count">0 tasks left</span>
      <button id="clearDone">Clear completed</button>
    </div>
  </div>

  <footer>Built with ❤️ by <a href="https://github.com/shahabkhan4636" target="_blank">Shahab Khan</a> · <a href="https://github.com/shahabkhan4636/TodoApp.pk" target="_blank">View on GitHub</a></footer>

<script>
const list = document.getElementById('list');
const input = document.getElementById('newTask');
const countEl = document.getElementById('count');
let filter = 'all';
let todos = JSON.parse(localStorage.getItem('todoAppData') || '[]');

function save(){ localStorage.setItem('todoAppData', JSON.stringify(todos)); }
function render(){
  list.innerHTML = '';
  const visible = todos.filter(t => filter==='all' || (filter==='active' ? !t.done : t.done));
  if(!visible.length){
    list.innerHTML = `<li class="empty">${todos.length ? 'Nothing here 🎉' : 'No tasks yet — add your first one above! ✍️'}</li>`;
  }
  visible.forEach(t=>{
    const li = document.createElement('li');
    if(t.done) li.className='done';
    li.innerHTML = `
      <input type="checkbox" ${t.done?'checked':''}>
      <span class="text">${escapeHtml(t.text)}</span>
      <button class="edit" title="Edit">✏️</button>
      <button class="del" title="Delete">🗑️</button>`;
    li.querySelector('input[type=checkbox]').onchange = e=>{ t.done=e.target.checked; save(); render(); };
    li.querySelector('.del').onclick = ()=>{ todos = todos.filter(x=>x!==t); save(); render(); };
    li.querySelector('.edit').onclick = ()=>{
      const inp = document.createElement('input');
      inp.className='edit-input'; inp.value=t.text;
      li.querySelector('.text').replaceWith(inp); inp.focus(); inp.select();
      const commit = ()=>{ const v=inp.value.trim(); if(v) t.text=v; save(); render(); };
      inp.onblur = commit;
      inp.onkeydown = e=>{ if(e.key==='Enter') commit(); if(e.key==='Escape') render(); };
    };
    list.appendChild(li);
  });
  const left = todos.filter(t=>!t.done).length;
  countEl.textContent = `${left} task${left!==1?'s':''} left`;
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function addTask(){
  const v = input.value.trim();
  if(!v) return;
  todos.unshift({text:v, done:false});
  input.value=''; save(); render(); input.focus();
}
document.getElementById('addBtn').onclick = addTask;
input.addEventListener('keydown',e=>{ if(e.key==='Enter') addTask(); });
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); filter=b.dataset.f; render();
});
document.getElementById('clearDone').onclick = ()=>{ todos = todos.filter(t=>!t.done); save(); render(); };
render();
</script>
</body>
</html>
